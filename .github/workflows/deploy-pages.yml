name: Build and deploy to GitHub Pages

# The repo holds the generator and the content, not the 6,500 generated pages.
# CI runs the build, so a copy edit is a one-line diff instead of a 145MB commit.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "Which pages to build"
        type: choice
        options: ["everything (all 6,532)", "indexable only (Phase 1 + 2)"]
        default: "everything (all 6,532)"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the site
        env:
          # GitHub Pages serves a project repo under /<repo>/, so the generator
          # prefixes every root-relative URL to match.
          SITE_BASE: /${{ github.event.repository.name }}
        run: |
          # The preview deploy is noindex, so it ships every page and the whole
          # architecture is browsable. Only a manual run narrows it.
          if [ "${{ github.event.inputs.scope }}" = "indexable only (Phase 1 + 2)" ]; then
            python3 build.py --clean --lint
          else
            python3 build.py --all --clean --lint
          fi

      - name: Verify the build
        run: python3 qa.py

      # This is a preview, not the live site. Nothing here may be indexed.
      - name: Keep the preview out of search engines
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          # Every page gets noindex, nofollow, whatever the generator set.
          find dist -name '*.html' -print0 | xargs -0 perl -0777 -pi -e \
            's{<meta name="robots" content="[^"]*">}{<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">}i;'
          # Canonicals point at consultusdigital.com. On a preview that invites a
          # crawler to treat this as a copy of the real site, so strip them.
          find dist -name '*.html' -print0 | xargs -0 perl -0777 -pi -e \
            's{<link rel="canonical" href="[^"]*">}{}i;'
          # Sitemaps advertise URLs for crawling. A preview should not have any.
          rm -f dist/*sitemap*.xml
          echo "Verifying no page is indexable:"
          ! grep -rl 'content="index' dist --include='*.html' | head -1 | grep . || exit 1
          echo "  no indexable pages found"
          test ! -f dist/sitemap_index.xml && echo "  no sitemaps published"
          grep -q 'Disallow: /' dist/robots.txt && echo "  robots.txt disallows all"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
